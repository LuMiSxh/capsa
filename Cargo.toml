[workspace]
resolver = "3"
members = ["acus/crates/*", "pons", "core", "census", "vicarius"]

# Tools keep their own versions; crates set `version` themselves.
[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MPL-2.0"
repository = "https://github.com/LuMiSxh/capsa"

[workspace.dependencies]
# capsa crates
capsa-core = { path = "core" }
# acus crates
acus-walk = { path = "acus/crates/acus-walk" }
acus-syntax = { path = "acus/crates/acus-syntax", default-features = false }
acus-edit = { path = "acus/crates/acus-edit" }
acus-search = { path = "acus/crates/acus-search" }
acus-guard = { path = "acus/crates/acus-guard", default-features = false }
# shared
anstyle = "1.0.14"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
flate2 = "1.1.10"
globset = "0.4.21"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
ignore = "0.4.34"
insta = "1.49.0"
libc = "0.2.191"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value", "preserve_order"] }
sha2 = "0.11.1"
similar = "3.2.1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1.54.1", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.4"
tree-sitter-powershell = "0.26.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-scss = "1.0.0"
tree-sitter-svelte-ng = "1.0.2"
tree-sitter-swift = "0.7.4"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-zsh = "0.63.4"
ureq = { version = "3.5.0", features = ["json"] }
windows-sys = "0.61.2"
zip = { version = "9.2.2", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# restriction: no panics outside tests (clippy.toml allows them in tests)
unwrap_used = "warn"
expect_used = "warn"
# restriction: modules are foo/mod.rs
self_named_module_files = "warn"
# restriction: every silenced lint states why
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# pedantic, chosen for performance and readability
needless_pass_by_value = "warn"
redundant_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
uninlined_format_args = "warn"
too_many_lines = "warn"

# acus
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# pons: its fail-safe catches panics in the message rules.
[profile.release-unwind]
inherits = "release"
panic = "unwind"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
