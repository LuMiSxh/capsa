[package]
name = "acus-cli"
description = "acus: agent-first code search, outline and editing."
version = "0.26.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "acus"
path = "src/main.rs"

[features]
default = ["lang-rust", "lang-swift", "lang-ts", "lang-python", "lang-markdown", "lang-svelte", "lang-data", "lang-shell", "lang-c", "lang-css", "lang-scss", "lang-html", "lang-xml", "guard-bash", "guard-zsh", "guard-powershell", "cmd-update", "script"]
lang-rust = ["acus-syntax/lang-rust"]
lang-swift = ["acus-syntax/lang-swift"]
lang-ts = ["acus-syntax/lang-ts"]
lang-python = ["acus-syntax/lang-python"]
lang-markdown = ["acus-syntax/lang-markdown"]
lang-svelte = ["acus-syntax/lang-svelte"]
lang-data = ["acus-syntax/lang-data"]
lang-shell = ["acus-syntax/lang-shell"]
lang-c = ["acus-syntax/lang-c"]
lang-css = ["acus-syntax/lang-css"]
lang-scss = ["acus-syntax/lang-scss"]
lang-html = ["acus-syntax/lang-html"]
lang-xml = ["acus-syntax/lang-xml"]
# Guard parsers. Each grammar is a few MB of generated C; without any, the guard falls back
# to its hand-written splitter. See docs/guard.md.
guard-bash = ["acus-guard/bash"]
guard-zsh = ["acus-guard/zsh"]
guard-powershell = ["acus-guard/powershell"]
# `acus self update` and `acus self uninstall`; network only when called.
cmd-update = ["capsa-core/update"]
# `acus script`: an embedded QuickJS engine and an MCP client, linked only into this feature.
script = ["dep:acus-script", "dep:acus-mcp", "dep:chrono", "dep:htmd", "dep:serde_norway", "dep:ureq", "dep:url"]

[dependencies]
acus-edit.workspace = true
acus-guard.workspace = true
acus-search.workspace = true
acus-syntax.workspace = true
acus-walk.workspace = true
anyhow.workspace = true
capsa-core = { workspace = true, features = ["clap", "config", "process"] }
chrono = { workspace = true, optional = true }
clap.workspace = true
regex.workspace = true
acus-mcp = { workspace = true, optional = true }
acus-script = { workspace = true, optional = true }
htmd = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
serde_norway = { workspace = true, optional = true }
url = { workspace = true, optional = true }
serde.workspace = true
similar.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
tempfile.workspace = true

[[bench]]
name = "core"
harness = false
