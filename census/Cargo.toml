[package]
name = "census"
description = "Usage analytics for Claude Code and Codex transcripts."
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["cmd-update"]
# `census self update` and `census self uninstall`; network only when called.
cmd-update = ["capsa-core/update"]

[dependencies]
anstyle.workspace = true
anyhow.workspace = true
capsa-core = { workspace = true, features = ["clap"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
