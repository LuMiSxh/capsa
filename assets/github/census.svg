<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- census: tally marks incised on a wax tablet, faceted slab -->
  <defs>
    <linearGradient id="census-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2119"/>
      <stop offset="1" stop-color="#120d09"/>
    </linearGradient>
    <linearGradient id="census-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb8ff"/>
      <stop offset="1" stop-color="#9c7ae8"/>
    </linearGradient>
    <linearGradient id="census-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c7ae8"/>
      <stop offset="1" stop-color="#6a43c2"/>
    </linearGradient>
    <linearGradient id="census-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a43c2"/>
      <stop offset="1" stop-color="#3a2280"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#census-plate)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
  <polygon points="192,154 352,154 320,178 160,178" fill="url(#census-light)"/>
  <rect x="160" y="178" width="160" height="180" fill="url(#census-mid)"/>
  <polygon points="320,178 352,154 352,334 320,358" fill="url(#census-dark)"/>
  <rect x="178" y="196" width="124" height="144" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
  <g stroke="#eee6ff" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M200 216 L200 296"/>
    <path d="M220 216 L220 296"/>
    <path d="M240 216 L240 296"/>
    <path d="M260 216 L260 296"/>
    <path d="M184 290 L276 222"/>
  </g>
  <polyline points="160,358 160,178 192,154 352,154" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="352,154 352,334 320,358" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round"/>
</svg>
