name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            scope: ""
          # velum is macOS-only for now (velum/AGENTS.md), so Linux and Windows leave it out.
          - os: ubuntu-latest
            scope: "--exclude velum"
          - os: windows-latest
            scope: "--exclude velum"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # rustup reads rust-toolchain.toml (1.99.1) and installs it with clippy and rustfmt.
      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace ${{ matrix.scope }} --all-targets -- -D warnings
      - run: cargo clippy --workspace ${{ matrix.scope }} --all-targets --all-features -- -D warnings
      - run: cargo test --workspace ${{ matrix.scope }} --all-features
